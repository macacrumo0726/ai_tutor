services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      AI_TUTOR_API_HOST: 0.0.0.0
      AI_TUTOR_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - tutor-data:/app/data/app
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  tutor-data:
