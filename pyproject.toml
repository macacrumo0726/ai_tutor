[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precalculus-ai-tutor"
version = "0.1.0"
description = "Reproducible platform for prerequisite-aware retrieval in a Precalculus tutor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<3",
  "pandas>=1.5,<3",
  "networkx>=2.8,<4",
  "PyYAML>=6,<7",
  "rank-bm25>=0.2.2,<0.3",
  "gradio>=4,<6",
  "pydantic>=2,<2.11",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.2,<4", "faiss-cpu>=1.7,<2"]
pdf = ["PyMuPDF>=1.22,<2", "pyarrow>=10,<20"]
providers = ["openai>=1,<3", "google-genai>=1,<2", "transformers>=4.35,<5", "torch>=2,<3"]
training = ["transformers>=4.51,<6", "datasets>=3,<5", "trl>=0.20,<1", "peft>=0.15,<1", "accelerate>=1,<2"]
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]
dev = ["pytest>=7,<9", "pytest-cov>=4,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
